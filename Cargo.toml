[package]
name = "conformance"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Checks that a parser adapter keeps the Sootmark adapter contract."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Sootmark/conformance"
publish = false

[dependencies]
model = { git = "https://github.com/Sootmark/model", tag = "v0.1.1", version = "0.1.1" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
