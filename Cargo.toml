[package]
name = "sootmark-conformance"
version = "0.2.0"
edition = "2021"
rust-version = "1.80"
description = "Checks that a parser adapter keeps the Sootmark adapter contract."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Sootmark/conformance"
homepage = "https://sootmark.com"
keywords = ["forensics", "dfir", "incident-response"]
# Sources only: test fixtures (disk images, logs, test keys) stay in the repository.
include = ["/src", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT"]

[dependencies]
model = { package = "sootmark-model", version = "0.2.0" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
